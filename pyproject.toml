[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skinnytools"
version = "0.1.0"
description = "Compress tool results to prevent agent context window explosion"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
skinnytools = "skinnytools.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/skinnytools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
